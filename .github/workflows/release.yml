name: Release

# Publish a GitHub release with a tag such as v1.2.0 to push Monoslice.Templates 1.2.0 to NuGet.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Smoke test the templates
        run: ./scripts/test-templates.sh default

      - name: Pack
        run: dotnet pack Monoslice.Templates.csproj --configuration Release --output artifacts -p:PackageVersion="$VERSION"

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Attach package to the release
        run: gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg --clobber
        env:
          GH_TOKEN: ${{ github.token }}
