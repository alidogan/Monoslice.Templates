trigger:
  branches:
    include: [main]

pr:
  branches:
    include: ['*']

pool:
  vmImage: ubuntu-latest

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      useGlobalJson: true

  - script: dotnet restore
    displayName: Restore

  - script: dotnet format --verify-no-changes --no-restore
    displayName: Check formatting

  - script: dotnet build --no-restore --configuration Release
    displayName: Build

  # Integration tests start their database in a container (Testcontainers); Docker is available on the agent.
  - script: dotnet test --no-build --configuration Release
    displayName: Test
#if (UseDocker)

  - script: docker build --file src/Bootstrapper/Api/Dockerfile --tag api:$(Build.BuildId) .
    displayName: Build container image
#endif
