name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Integration tests start their database in a container (Testcontainers); Docker is available on the runner.
      - name: Test
        run: dotnet test --no-build --configuration Release
#if (UseDocker)

      - name: Build container image
        run: docker build --file src/Bootstrapper/Api/Dockerfile --tag api:${{ github.sha }} .
#endif
